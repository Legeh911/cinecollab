<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCollab - Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Cine<span>Collab</span></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Projects & Crew</a></li>
                <li><a href="portfolio.html">Showcase</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title">Get in Touch</h2>
        <p>Have questions about pitching a film project, joining a crew, or collaborating with other creators? Send us a message below.</p>

        <div style="max-width: 600px; margin-top: 1.5rem;">
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name / Creative Alias</label>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" id="emailAddress" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject / Production Title</label>
                    <input type="text" id="subject" placeholder="Collaboration Inquiry" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type your message or project pitch here..." required></textarea>
                </div>
                <button type="submit" class="btn" style="border: none; cursor: pointer;">Send Message</button>
            </form>
            <div id="formFeedback" style="margin-top: 1rem; display: none;"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CineCollab. All Rights Reserved. Designed for CIIS 332.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
